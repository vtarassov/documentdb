include '../../../regress/postgresql_base.conf'

shared_preload_libraries = 'pg_cron,pg_documentdb_core,pg_documentdb,pg_documentdb_extended_btree'

# Use extended btree for index_am
documentdb.alternate_index_handler_name = 'extended_btree'

# disable background jobs to prevent flakeyness.
documentdb.enableBackgroundWorkerJobs = 'false'
